name: Release

# A release enters `main` through the same door as everything else.
#
# Two halves, and the merge button between them. `Run workflow` proposes:
# cargo-release bumps every crate in lockstep, git-cliff writes the changelog
# into the same commit, and the whole thing arrives as a
# `chore(release): v<version>` pull request on a branch. Nothing is tagged and
# nothing reaches `main` until you merge it.
#
# Merging is what publishes. Every push to `main` asks whether the version in
# the tree has a release yet; when it does not, this workflow tags the commit
# if needed, builds
# the four Linux artifacts on native runners, generates the SBOM, signs the
# provenance, and creates the GitHub Release with the tarballs and
# SHASUMS256.txt that install.sh consumes. Asking about the release rather
# than the tag is what lets a publish that failed halfway be finished by the
# commit that fixes it.
#
# It used to push the release commit straight to `main`, which a branch
# ruleset refuses — correctly. See docs/versioning.md for the full flow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: false
        default: alpha
        type: choice
        options:
          - alpha
          - patch
          - minor
          - major
  push:
    branches: [main]
    # No path filter. The check below is a checkout and one API call, and it
    # answers "is this version released yet" — so every push is allowed to
    # ask. A filter on `Cargo.toml` looked cheaper and had a failure mode
    # that cost a release: the fix for a broken publish does not touch
    # `Cargo.toml`, so merging it would not have retried the publish it
    # fixed.

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  propose:
    name: Propose the release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # git-cliff needs the full history plus existing tags.
          fetch-depth: 0
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          # cargo-release and git-cliff are pinned: the release changelog
          # depends on `git-cliff -t` naming. The rest are what the
          # `make check` pre-release-hook shells out to (see release.toml) —
          # a gate that cannot run is a gate that does not gate.
          tool: cargo-release@1.1.5,git-cliff@2.13.1,cargo-deny,cargo-about,ruff
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-propose
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump, changelog, branch
        id: release
        run: |
          set -euo pipefail
          # On a branch from the start: `cargo release` commits, and this one
          # is going to be reviewed like any other change.
          git switch -c "release/pending"
          # Runs the `make check` pre-release-hook first (see release.toml):
          # if the gate fails, nothing is bumped or committed. `--no-tag`
          # because the tag belongs on the merge commit, not on this branch.
          cargo release "${{ inputs.bump }}" --execute --no-confirm --no-tag
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "could not read version from Cargo.toml" >&2; exit 1; }
          tag="v${version}"
          # `-t` names the release section before the tag physically exists;
          # with the tag already present git-cliff would see an empty range
          # and omit the section entirely.
          git-cliff -t "$tag" -o CHANGELOG.md
          git add CHANGELOG.md
          git commit --amend --no-edit
          git branch -m "release/${tag}"
          git push origin "release/${tag}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Open the release pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.release.outputs.tag }}"
          gh pr create \
            --base main \
            --head "release/${tag}" \
            --title "chore(release): ${tag}" \
            --body "$(printf '%s\n' \
              "Version bump across every workspace crate, with the changelog for \`${tag}\` folded into the same commit." \
              "" \
              "Merging this tags the merge commit \`${tag}\` and publishes the release: four Linux tarballs, the SBOM, signed provenance and SHASUMS256.txt." \
              "" \
              "Generated by the Release workflow.")"

  tag:
    name: Tag the release commit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      tag: ${{ steps.detect.outputs.tag }}
      release: ${{ steps.detect.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      # `Cargo.toml` changes for many reasons; a release is the one whose
      # version has no *published release* behind it. Asking about the
      # release rather than the tag is what lets a half-finished attempt
      # finish: the first one tagged `v0.0.0-alpha.1` and then failed to
      # build two of its four targets, which under a tag-only check would
      # have left that version unpublishable forever.
      - name: Is this a version with no release?
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "could not read version from Cargo.toml" >&2; exit 1; }
          tag="v${version}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "${tag} is already released — nothing to do"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      # Only when it is missing: a tag that already points at this commit is
      # the earlier attempt's, and moving it would change what a `v*` means.
      - name: Create the tag
        if: steps.detect.outputs.release == 'true'
        run: |
          set -euo pipefail
          tag="${{ steps.detect.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists — reusing it"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"

  package:
    name: Package ${{ matrix.target }}
    needs: tag
    if: needs.tag.outputs.release == 'true'
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build exactly what was released and pushed by `prepare`.
          ref: ${{ needs.tag.outputs.tag }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      # syntect pulls `onig_sys`, which compiles Oniguruma from C, so a musl
      # target needs a musl C toolchain — the gnu ones use the runner's own
      # gcc and were the two that passed. cc-rs looks for
      # `<target>-linux-musl-gcc`, a name musl-tools does not install, so
      # point it at the one that exists. Each musl target builds on a runner
      # of its own architecture, which is why plain `musl-gcc` is right for
      # both.
      - name: Install the musl C toolchain
        if: endsWith(matrix.target, '-musl')
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq musl-tools
          echo "CC_$(echo '${{ matrix.target }}' | tr '-' '_')=musl-gcc" >> "$GITHUB_ENV"
      - run: cargo build --locked --release --bin uze --target ${{ matrix.target }}
      # Apache-2.0 4(a) and 4(d): whoever receives the binary has to receive
      # the licence and the NOTICE with it. Staging them beside the binary is
      # what puts them inside the tarball - the archive used to carry the
      # executable alone. CREDITS.md travels with them because the NOTICE
      # points at it, and a pointer to a file the recipient does not have is
      # worse than no pointer.
      - name: Package release archive
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/uze" staging/
          cp LICENSE NOTICE CREDITS.md staging/
          tar -C staging -czf "dist/uze-${{ matrix.target }}.tar.gz" \
            uze LICENSE NOTICE CREDITS.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uze-${{ matrix.target }}
          path: dist/uze-${{ matrix.target }}.tar.gz
          retention-days: 1

  publish:
    name: Publish release
    needs: [tag, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance: `id-token` mints the OIDC token that proves
      # the claim came from this workflow, `attestations` records it.
      id-token: write
      attestations: write
    steps:
      # Checkout first, and only then the artifacts. `actions/checkout` cleans
      # the workspace, so downloading before it deleted the four tarballs it
      # had just fetched — the publish failed on `dist/uze-*.tar.gz: No such
      # file or directory` after every target had built successfully.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag, so the SBOM describes the tree the binaries were built
          # from rather than whatever `main` has moved on to.
          ref: ${{ needs.tag.outputs.tag }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: cargo-cyclonedx
      # CREDITS.md answers "may I ship this" for a human; an SBOM answers
      # "what is in here" for a scanner, and a user auditing a CVE should not
      # have to parse prose to find out whether they are exposed.
      # One document for the binary crate, without build-time dependencies:
      # what ships is what a scanner should be asked about.
      - name: Generate the SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --no-build-deps
      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p assets
          mv dist/uze-*.tar.gz assets/
          cp uze.cdx.json assets/uze-sbom.cdx.json
          (cd assets && sha256sum *.tar.gz *.cdx.json > SHASUMS256.txt)
          ls -l assets/
          cat assets/SHASUMS256.txt
      # Signed provenance for each asset: which workflow, which commit, which
      # runner built it. Without it a tarball claiming to be uze is only as
      # trustworthy as the page it was downloaded from. Verified with
      # `gh attestation verify uze-<target>.tar.gz --repo hiukky/uze`.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "assets/uze-*.tar.gz, assets/uze-sbom.cdx.json"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.tag.outputs.tag }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists — uploading assets"
            gh release upload "$tag" assets/* --clobber
          else
            # Titled by the tag itself. A release called "uze 0.0.0-alpha.1"
            # repeats the repository's own name back at the reader and reads
            # as a different identifier from the `v0.0.0-alpha.1` that
            # install.sh, the changelog and the tag ruleset all speak.
            gh release create "$tag" assets/* \
              --title "$tag" \
              --notes "One-click release: version bump, changelog and tag are in the \`chore(release)\` commit ($tag)."
          fi
          gh release view "$tag" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'