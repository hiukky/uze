name: Release

# One-click release publisher. Run from Actions -> Release -> Run workflow.
# Everything happens here, in order: the make check gate (fmt + clippy +
# tests), the cargo-release bump of every workspace crate in lockstep, the
# `chore(release): bump workspace version to <v>` commit, CHANGELOG.md
# regeneration folded into that same commit, the annotated `v<v>` tag, the
# branch + tag push, the four Linux artifacts built from the tag on native
# runners, and the GitHub Release with tarballs + SHASUMS256.txt that
# install.sh consumes. See docs/versioning.md for the full flow.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to apply
        required: false
        default: alpha
        type: choice
        options:
          - alpha
          - patch
          - minor
          - major

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Bump, changelog, tag, push
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # git-cliff needs the full history plus existing tags;
          # cargo-release needs to push branch + tag afterwards.
          fetch-depth: 0
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          # cargo-release and git-cliff are pinned: the release changelog
          # depends on `git-cliff -t` naming. The rest are what the
          # `make check` pre-release-hook shells out to (see release.toml) —
          # a gate that cannot run is a gate that does not gate, and this
          # workflow has never been exercised, so nothing here has ever
          # caught it.
          tool: cargo-release@1.1.5,git-cliff@2.13.1,cargo-deny,cargo-about,ruff
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-prepare
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      - name: Bump, changelog, tag and push
        id: release
        run: |
          set -euo pipefail
          # Runs the `make check` pre-release-hook first (see release.toml):
          # if the gate fails, nothing is bumped, committed or tagged.
          # `--no-tag` defers the tag so the changelog can be folded into
          # the release commit before the tag is created on it.
          cargo release "${{ inputs.bump }}" --execute --no-confirm --no-tag
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' Cargo.toml | head -n 1)"
          [ -n "$version" ] || { echo "could not read version from Cargo.toml" >&2; exit 1; }
          tag="v${version}"
          # `-t` names the release section before the tag physically exists;
          # with the tag already present (and pointing at HEAD) git-cliff
          # would see an empty range and omit the section entirely.
          git-cliff -t "$tag" -o CHANGELOG.md
          git add CHANGELOG.md
          git commit --amend --no-edit
          git tag -a "$tag" -m "uze $version"
          git push origin main
          git push origin "$tag"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  package:
    name: Package ${{ matrix.target }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Build exactly what was released and pushed by `prepare`.
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --locked --release --bin uze --target ${{ matrix.target }}
      # Apache-2.0 4(a) and 4(d): whoever receives the binary has to receive
      # the licence and the NOTICE with it. Staging them beside the binary is
      # what puts them inside the tarball - the archive used to carry the
      # executable alone. CREDITS.md travels with them because the NOTICE
      # points at it, and a pointer to a file the recipient does not have is
      # worse than no pointer.
      - name: Package release archive
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/uze" staging/
          cp LICENSE NOTICE CREDITS.md staging/
          tar -C staging -czf "dist/uze-${{ matrix.target }}.tar.gz" \
            uze LICENSE NOTICE CREDITS.md
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: uze-${{ matrix.target }}
          path: dist/uze-${{ matrix.target }}.tar.gz
          retention-days: 1

  publish:
    name: Publish release
    needs: [prepare, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Signing the provenance: `id-token` mints the OIDC token that proves
      # the claim came from this workflow, `attestations` records it.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The tag, so the SBOM describes the tree the binaries were built
          # from rather than whatever `main` has moved on to.
          ref: ${{ needs.prepare.outputs.tag }}
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: cargo-cyclonedx
      # CREDITS.md answers "may I ship this" for a human; an SBOM answers
      # "what is in here" for a scanner, and a user auditing a CVE should not
      # have to parse prose to find out whether they are exposed.
      # One document for the binary crate, without build-time dependencies:
      # what ships is what a scanner should be asked about.
      - name: Generate the SBOM
        run: cargo cyclonedx --format json --spec-version 1.5 --no-build-deps
      - name: Collect assets and checksums
        run: |
          set -euo pipefail
          mkdir -p assets
          mv dist/uze-*.tar.gz assets/
          cp uze.cdx.json assets/uze-sbom.cdx.json
          (cd assets && sha256sum *.tar.gz *.cdx.json > SHASUMS256.txt)
          ls -l assets/
          cat assets/SHASUMS256.txt
      # Signed provenance for each asset: which workflow, which commit, which
      # runner built it. Without it a tarball claiming to be uze is only as
      # trustworthy as the page it was downloaded from. Verified with
      # `gh attestation verify uze-<target>.tar.gz --repo hiukky/uze`.
      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "assets/uze-*.tar.gz, assets/uze-sbom.cdx.json"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.prepare.outputs.tag }}"
          version="${{ needs.prepare.outputs.version }}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag exists — uploading assets"
            gh release upload "$tag" assets/* --clobber
          else
            gh release create "$tag" assets/* \
              --title "uze $version" \
              --notes "One-click release: version bump, changelog and tag are in the \`chore(release)\` commit ($tag)."
          fi
          gh release view "$tag" --json tagName,assets --jq '{tag: .tagName, assets: [.assets[].name]}'