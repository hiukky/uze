name: Conformance

# The Harness Conformance Lab: the real harness binaries against a synthetic
# provider, in a disposable Docker network with no Internet and no tokens.
#
# Its own workflow, and not part of CI, for one reason: at ~34 runner-minutes
# it is 89% of what an event costs, and it can only be affected by the code
# that is baked into the Lab image. A documentation or web change ran the
# whole matrix and could only ever fail it for reasons of its own — which is
# exactly what happened to #11, red on a vertical it did not touch.

on:
  push:
    branches: [main]
    # Repeated rather than anchored: GitHub Actions does not resolve YAML
    # aliases, and a filter it silently ignores is a filter that does not
    # filter. Keep the two lists identical.
    paths:
      - "src/**"
      - "crates/**"
      - "tests/_fixtures/**"
      - "plugins/**"
      - "marketplace.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "conformance/**"
      - ".github/workflows/conformance.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "tests/_fixtures/**"
      - "plugins/**"
      - "marketplace.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "conformance/**"
      - ".github/workflows/conformance.yml"
  # Nightly runs regardless of what changed: the harnesses install
  # channel-latest, so a vertical goes red on a vendor release with no commit
  # of ours behind it.
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: conformance-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  conformance:
    name: E2E - ${{ matrix.label }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: antigravity
            label: Antigravity
          - harness: claude
            label: Claude
          - harness: codex
            label: Codex
          - harness: opencode
            label: OpenCode
    steps:
      - uses: actions/checkout@v7
      # The Lab image bakes the real harness binaries (channel-latest),
      # the `uze` binary and the fixture tree; `lab.py` runs each vertical
      # against it in a disposable `--internal` network — zero Internet,
      # zero tokens.
      - name: Build the Lab harness image
        run: docker build -f conformance/Dockerfile -t conformance-harness:latest .
      - name: Install Lab runner dependency
        run: python3 -m pip install --user pexpect
      - name: Run the ${{ matrix.harness }} vertical
        run: |
          python3 conformance/lab.py --harness ${{ matrix.harness }} --write-summary --retry-once
        env:
          AGY_OUTDIR: /tmp/harness-conformance/${{ matrix.harness }}/run1
          UZE_EVIDENCE_DIR: /tmp/harness-conformance/${{ matrix.harness }}/run1/evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-${{ matrix.harness }}
          path: /tmp/harness-conformance/${{ matrix.harness }}/run1/
          retention-days: 90
          if-no-files-found: ignore
      # Evidence lives in Actions artifacts (downloadable via UI/API,
      # retention-days above); summaries are written beside them instead of
      # being pushed to main — the parallel jobs raced each other on git
      # pushes, and artifact storage carries the same audit trail without
      # the commit churn (ADR-035 revised).

  conformance-stability:
    name: Stability - ${{ matrix.label }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: antigravity
            label: Antigravity
          - harness: claude
            label: Claude
          - harness: codex
            label: Codex
          - harness: opencode
            label: OpenCode
    steps:
      - uses: actions/checkout@v7
      - name: Build the Lab harness image
        run: docker build -f conformance/Dockerfile -t conformance-harness:latest .
      - name: Install Lab runner dependency
        run: python3 -m pip install --user pexpect
      # ADR-035 promotion gate: 3 consecutive clean runs per vertical.
      # A run counts clean when the gate line reports PASS == total, no
      # check failure (❌), and no run-level crash.
      - name: Run 3 consecutive gate runs
        run: |
          mkdir -p /tmp/stability/${{ matrix.harness }}
          fails=0
          for i in 1 2 3; do
            python3 conformance/lab.py --harness ${{ matrix.harness }} --write-summary \
              > /tmp/stability/${{ matrix.harness }}/run$i.log 2>&1 || true
            log=/tmp/stability/${{ matrix.harness }}/run$i.log
            if grep -q "RUN CRASH\|❌" "$log" \
               || ! grep -q "=== [0-9]*/[0-9]* asserted PASS" "$log"; then
              echo "flake in run $i:"; tail -n 12 "$log"; fails=$((fails+1))
            else
              echo "run $i clean"
            fi
          done
          echo "stability: $((3-fails))/3 clean for ${{ matrix.harness }}"
          exit $fails
      - name: Upload stability logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-stability-${{ matrix.harness }}
          path: /tmp/stability/${{ matrix.harness }}/
          retention-days: 30
          if-no-files-found: ignore
      # Evidence lives in Actions artifacts (see the conformance job);
      # summaries are written beside the run evidence, never pushed.
