name: Conformance stability

# ADR-035's promotion gate: three consecutive clean runs of a vertical.
#
# Nightly only, and its own workflow rather than a job that skips itself on
# every pull request. A check that can never run on a pull request is noise
# on one — and a skipped matrix job is not even legible, since GitHub does
# not expand the matrix of a job it did not run.

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: conformance-stability
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # One image, four verticals — the same reason `conformance.yml` splits it
  # out, doubled by the cadence here: this workflow built the image four
  # times a night to run four matrix legs against what were, strictly, four
  # different images. `uze setup` installs the harnesses channel-latest, and
  # a promotion gate that asks whether a vertical is stable cannot have the
  # ground move between the legs it is comparing.
  image:
    name: Image
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Build the Lab harness image
        run: docker build -f conformance/Dockerfile -t conformance-harness:latest .
      - name: Hand it to the verticals
        run: docker save conformance-harness:latest | zstd -T0 -3 -o /tmp/lab-image.tar.zst
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lab-image-stability
          path: /tmp/lab-image.tar.zst
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  conformance-stability:
    name: Stability - ${{ matrix.label }}
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: antigravity
            label: Antigravity
          - harness: claude
            label: Claude
          - harness: codex
            label: Codex
          - harness: opencode
            label: OpenCode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: lab-image-stability
          path: /tmp
      - name: Load the Lab image
        run: zstd -d -c /tmp/lab-image.tar.zst | docker load
      - name: Install Lab runner dependency
        run: python3 -m pip install --user pexpect
      # ADR-035 promotion gate: 3 consecutive clean runs per vertical.
      # A run counts clean when the runner says so — `lab.py` exits 0 only
      # when every asserted check passed and no run-level crash happened.
      # Re-deriving that from the log is how this gate spent months green
      # over red runs: it searched for a `❌` the runner never prints (a
      # failure line is `✕`) and accepted any `N/M asserted PASS` line,
      # including 46/49.
      - name: Run 3 consecutive gate runs
        run: |
          mkdir -p /tmp/stability/${{ matrix.harness }}
          fails=0
          for i in 1 2 3; do
            log=/tmp/stability/${{ matrix.harness }}/run$i.log
            if python3 conformance/lab.py --harness ${{ matrix.harness }} --write-summary \
                 > "$log" 2>&1; then
              echo "run $i clean"
            else
              echo "flake in run $i:"; tail -n 12 "$log"; fails=$((fails+1))
            fi
          done
          echo "stability: $((3-fails))/3 clean for ${{ matrix.harness }}"
          exit $fails
      - name: Upload stability logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: conformance-stability-${{ matrix.harness }}
          path: /tmp/stability/${{ matrix.harness }}/
          retention-days: 30
          if-no-files-found: ignore
      # Evidence lives in Actions artifacts (see the conformance job);
      # summaries are written beside the run evidence, never pushed.
