name: Journeys

# A product journey performs a user's flow through the real CLI and the real
# TUI, then checks the machine it left behind. Its own workflow, like the
# Lab's — but on a very different budget: the Lab is ~34 runner-minutes of
# vendor binaries, and a journey is ~30 seconds on top of a build CI already
# pays for. That is why this gates a pull request rather than a release: the
# regressions it catches arrive in ordinary pull requests touching `src/ui`,
# and finding one at release time means bisecting a range instead of reading
# a diff.
on:
  push:
    branches: [main]
    # Repeated rather than anchored: GitHub Actions does not resolve YAML
    # aliases, and a filter it silently ignores is a filter that does not
    # filter. Keep the two lists identical.
    paths:
      - "src/**"
      - "crates/**"
      - "journeys/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/journeys.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "crates/**"
      - "journeys/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/journeys.yml"
  # Nightly runs everything, not just the gate tag, and records a cast.
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

concurrency:
  group: journeys-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  journeys:
    name: Journeys
    # Pinned, not `ubuntu-latest`. The journey drives a rendered screen, so
    # the terminal is part of the contract — the tmux build, the locale and
    # the unicode width tables decide where a glyph lands, and a moving
    # runner label is free to change all three under a selector with no
    # commit behind it. This label is the pin, and it is the same one
    # `journeys/Dockerfile` states as its `FROM`: both pin the Ubuntu
    # release, which is as far as either can pin.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      # What the image used to set. The frames are read as text, so the
      # locale is part of what a selector matches.
      LANG: C.UTF-8
      TERM: xterm-256color
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      # Run natively, on the runner itself. A hosted runner is already a
      # disposable machine, and `journey.py` builds its own world under
      # `JOURNEY_WORLDS` with a guard that refuses one overlapping a real
      # home — so the container was never what isolated the run. What it
      # pinned, `runs-on` above now pins directly, for free.
      #
      # The steps themselves live in a composite action shared with the macOS
      # job: two platforms proving the same journeys must perform them the
      # same way, and two copies of the same YAML is how that stops being
      # true without anybody noticing.
      #
      # `journeys/Dockerfile` and `make journey-docker` stay for local use —
      # running a journey on your own machine without letting it near your
      # own tmux, HOME or terminal.
      - uses: ./.github/actions/journeys
        with:
          # Nightly runs everything, not just the gate tag, and records a cast.
          args: ${{ github.event_name == 'schedule' && '--record' || '--tag gate' }}

      # Named, because "No files were found" on the upload below is how a
      # failing run lost its own evidence once: the artifact is silent about
      # an empty directory, and the reason it was empty is not visible
      # anywhere else.
      - name: Show what evidence was written
        if: always()
        run: ls -la journeys/.evidence/ || echo "no evidence directory at all"

      # Uploaded on failure and on the nightly: a journey's evidence is what
      # it read off the machine, and it is the whole point of having run it.
      #
      # `include-hidden-files` because the evidence lives under a dot
      # directory, which the action excludes by default — the step above
      # listed ten evidence directories and this one still reported "No
      # files were found", so the first failing run in CI lost exactly what
      # it was there to produce.
      - name: Keep the evidence
        if: failure() || github.event_name == 'schedule'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: journey-evidence-${{ github.run_id }}
          path: journeys/.evidence/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
