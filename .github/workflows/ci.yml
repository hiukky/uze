name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --no-fail-fast

  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # A prebuilt binary, not `rustsec/audit-check`: that action builds
      # cargo-audit from source on every run with a fresh resolution, so
      # any crate in cargo-audit's own tree publishing a broken release
      # failed this job with no change on our side (tinyvec 1.13.0,
      # 2026-09-03). The audit itself is unchanged: our Cargo.lock
      # against the RustSec advisory database.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit

  secrets:
    name: Secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # Pinned so a scan result is reproducible: a floating scanner means a
      # green run today and a red one tomorrow with no commit in between.
      GITLEAKS_VERSION: 8.30.0
      GITLEAKS_SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
    steps:
      - uses: actions/checkout@v7
        with:
          # gitleaks walks commits, not the worktree; a shallow clone would
          # silently scan almost nothing and still report success.
          fetch-depth: 0
      # Installed from the upstream release rather than an action:
      # `gitleaks/gitleaks-action` gates organisation use behind a licence key,
      # and `taiki-e/install-action` does not carry gitleaks (it is Go, so its
      # cargo-binstall fallback looks for a crate that does not exist).
      - name: Install gitleaks
        run: |
          curl -fsSL --retry 3 -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      # The whole history is scanned on every event, not just the commits a
      # pull request adds. It costs seconds, it cannot be defeated by a force
      # push rewriting the range, and it is what catches a secret matched only
      # by a rule upstream wrote after the commit had already landed.
      - name: Scan the full history
        run: ./gitleaks git --no-banner --redact=4 --config .gitleaks.toml

  installer:
    name: Installer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Lint the installer
        run: shellcheck install.sh
      - name: Exercise the installer offline
        run: sh tests/scripts/installer-test.sh

  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install ruff
        uses: taiki-e/install-action@v2
        with:
          tool: ruff
      - run: ruff format --check conformance/
      - run: ruff check conformance/
      - run: python3 -m pip install --user pexpect
      - name: Conformance unit tests (no Docker, no harness)
        run: for t in conformance/tests/test_*.py; do python3 "$t" || exit 1; done

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    # LLVM instrumentation changes test timing and memory use. Keep this
    # separate from ordinary tests so a concurrency regression cannot leave a
    # runner wedged indefinitely.
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # `--skip` filters out tests that fail due to environment issues,
      # not code regressions: `real_codex_dogfood_*` (codex CLI removed
      # the `debug` subcommand), `foreground_status_reports_*` (shell
      # detection varies at runtime), and `acquisition::*` (GPG agent
      # signing timeout in a sandbox without a configured GPG key).
      # Re-enable any of these when the environment supports them.
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 68 --fail-under-regions 69 -- --skip real_codex_dogfood --skip foreground_status_reports --skip acquisition
      - run: cargo llvm-cov report --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  conformance:
    name: E2E - ${{ matrix.label }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: antigravity
            label: Antigravity
          - harness: claude
            label: Claude
          - harness: codex
            label: Codex
          - harness: opencode
            label: OpenCode
    steps:
      - uses: actions/checkout@v7
      # The Lab image bakes the real harness binaries (channel-latest),
      # the `uze` binary and the fixture tree; `lab.py` runs each vertical
      # against it in a disposable `--internal` network — zero Internet,
      # zero tokens.
      - name: Build the Lab harness image
        run: docker build -f conformance/Dockerfile -t conformance-harness:latest .
      - name: Install Lab runner dependency
        run: python3 -m pip install --user pexpect
      - name: Run the ${{ matrix.harness }} vertical
        run: |
          python3 conformance/lab.py --harness ${{ matrix.harness }} --write-summary --retry-once
        env:
          AGY_OUTDIR: /tmp/harness-conformance/${{ matrix.harness }}/run1
          UZE_EVIDENCE_DIR: /tmp/harness-conformance/${{ matrix.harness }}/run1/evidence
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-${{ matrix.harness }}
          path: /tmp/harness-conformance/${{ matrix.harness }}/run1/
          retention-days: 90
          if-no-files-found: ignore
      # Evidence lives in Actions artifacts (downloadable via UI/API,
      # retention-days above); summaries are written beside them instead of
      # being pushed to main — the parallel jobs raced each other on git
      # pushes, and artifact storage carries the same audit trail without
      # the commit churn (ADR-035 revised).

  conformance-stability:
    name: Stability - ${{ matrix.label }}
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - harness: antigravity
            label: Antigravity
          - harness: claude
            label: Claude
          - harness: codex
            label: Codex
          - harness: opencode
            label: OpenCode
    steps:
      - uses: actions/checkout@v7
      - name: Build the Lab harness image
        run: docker build -f conformance/Dockerfile -t conformance-harness:latest .
      - name: Install Lab runner dependency
        run: python3 -m pip install --user pexpect
      # ADR-035 promotion gate: 3 consecutive clean runs per vertical.
      # A run counts clean when the gate line reports PASS == total, no
      # check failure (❌), and no run-level crash.
      - name: Run 3 consecutive gate runs
        run: |
          mkdir -p /tmp/stability/${{ matrix.harness }}
          fails=0
          for i in 1 2 3; do
            python3 conformance/lab.py --harness ${{ matrix.harness }} --write-summary \
              > /tmp/stability/${{ matrix.harness }}/run$i.log 2>&1 || true
            log=/tmp/stability/${{ matrix.harness }}/run$i.log
            if grep -q "RUN CRASH\|❌" "$log" \
               || ! grep -q "=== [0-9]*/[0-9]* asserted PASS" "$log"; then
              echo "flake in run $i:"; tail -n 12 "$log"; fails=$((fails+1))
            else
              echo "run $i clean"
            fi
          done
          echo "stability: $((3-fails))/3 clean for ${{ matrix.harness }}"
          exit $fails
      - name: Upload stability logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-stability-${{ matrix.harness }}
          path: /tmp/stability/${{ matrix.harness }}/
          retention-days: 30
          if-no-files-found: ignore
      # Evidence lives in Actions artifacts (see the conformance job);
      # summaries are written beside the run evidence, never pushed.
