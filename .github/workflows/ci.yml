name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  lint:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --no-fail-fast

  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    env:
      ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true
    steps:
      - uses: actions/checkout@v7
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov
      # `cargo llvm-cov --summary-only`'s TOTAL row is Regions/Functions/Lines,
      # in that order — not Lines/Functions/Regions. Currently ~71.1%
      # regions / 69.4% lines; floors set a few points under that as a
      # margin, not a ceiling — roadmap 68/69→80→90. `crates/` already
      # ~75%+; `src/ui/worker.rs` (thread-spawning dispatch, needs a fake
      # `UzeApplication`/channel harness to test meaningfully) is the
      # largest remaining gap. 90% global requires that plus real
      # codex/gemini harness tests, not shallow line chasing.
      - run: cargo llvm-cov --workspace --summary-only --fail-under-lines 68 --fail-under-regions 69
      - run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - uses: actions/upload-artifact@v7
        with:
          name: lcov
          path: lcov.info

  conformance:
    name: Conformance Lab (Real Harness + Synthetic World)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        harness: [antigravity, claude, codex, opencode]
    steps:
      - uses: actions/checkout@v7
      # The Lab image bakes the real harness binaries (channel-latest),
      # the `uze` binary and the fixture tree; `lab.py` runs each vertical
      # against it in a disposable `--internal` network — zero Internet,
      # zero tokens.
      - name: Build the Lab harness image
        run: docker build -f conformance/Dockerfile -t conformance-harness:latest .
      - name: Run the ${{ matrix.harness }} vertical
        run: |
          python3 conformance/lab.py --harness ${{ matrix.harness }}
        env:
          AGY_OUTDIR: /tmp/harness-conformance/${{ matrix.harness }}/run1
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: conformance-evidence-${{ matrix.harness }}
          path: /tmp/harness-conformance/${{ matrix.harness }}/run1/
          if-no-files-found: ignore
