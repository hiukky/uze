name: CLA

# Records that a contributor has signed CLA.md, by comment on their own
# pull request. It does one thing and touches nothing else — see the
# permissions below and the absence of a checkout step.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

# `pull_request_target` runs with the base repository's token, so a fork's
# code must never be checked out or executed in this workflow. Nothing here
# does: the action reads the pull request through the API and writes a
# signature file to another repository.
permissions:
  actions: write
  # The signature file lands on this repository's own `cla-signatures`
  # branch, so the workflow's token is enough — no personal access token to
  # mint, to scope, or to find expired on the day someone tries to sign.
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA signed
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Inert until `CLA_ACTIVE` is set to `true`. It stays unset while CLA.md
    # is marked DO NOT PUBLISH: nobody should be asked to agree to a document
    # that is still awaiting legal review.
    if: >-
      vars.CLA_ACTIVE == 'true' &&
      (github.event_name == 'pull_request_target' ||
       github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Versioned on purpose: a change to CLA.md that alters what a
          # signature means starts a new path, so nobody is recorded as
          # having agreed to a document they never read.
          path-to-signatures: signatures/v1/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          # An orphan branch of this repository, sharing no history with
          # `main`: signing a document should not put a commit in the history
          # of the project you are contributing to. It must stay unprotected,
          # which is why the ruleset targets the default branch rather than a
          # pattern that would catch this one too.
          branch: cla-signatures
          # Bots cannot agree to anything, and the maintainer is the party
          # the agreement is with. Without this, every dependency bump
          # blocks on a signature that will never come.
          allowlist: dependabot[bot],renovate[bot],hiukky
