# git-cliff configuration — generates CHANGELOG.md from this repo's existing
# Conventional Commits convention (`type(scope): summary`, see AGENTS.md /
# git commit history). Paired with cargo-release's `tag-name = "v{{version}}"`
# (see release.toml). Regenerate with `make changelog`.

[changelog]
header = """
# Changelog

All notable changes to UZE are documented here, generated from Conventional
Commits by `git-cliff` (`make changelog`). Until v1, UZE ships only SemVer
pre-releases — see `docs/versioning.md`.

"""
# A changelog nobody can navigate is a list of sentences. Every short SHA is a
# link to its commit, and every version heading is the diff against the one
# before it — which is the question a reader actually arrives with.
body = """
{% set repo = "https://github.com/hiukky/uze" %}\
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/compare/{{ previous.version }}...{{ version }})\
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }})\
    {% endif %}\
    {%- if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {{ commit.message | upper_first }}\
    {%- if commit.breaking %} [**breaking**]{% endif %} \
    ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

# Matches the types actually used in this repo's history (feat, fix, chore,
# docs, refactor, test, style, ci). The `<!-- n -->` prefixes are sort keys:
# `group_by` orders alphabetically, which put CI above Features, and the
# template's `striptags` removes them again before printing.
# `chore(release): ...` commits are the release-bump commits themselves;
# skipped so a release entry never lists its own bump.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^refactor", group = "<!-- 3 -->Refactor" },
  { message = "^perf", group = "<!-- 2 -->Performance" },
  { message = "^docs", group = "<!-- 4 -->Documentation" },
  { message = "^test", group = "<!-- 5 -->Tests" },
  { message = "^style", group = "<!-- 8 -->Style" },
  { message = "^ci", group = "<!-- 6 -->CI" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 7 -->Chore" },
  { message = ".*", group = "<!-- 9 -->Other" },
]
