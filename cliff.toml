# git-cliff configuration — generates CHANGELOG.md from this repo's existing
# Conventional Commits convention (`type(scope): summary`, see AGENTS.md /
# git commit history). Paired with cargo-release's `tag-name = "v{{version}}"`
# (see release.toml). Regenerate with `make changelog`.
#
# This file writes the *file*; `cliff.release.toml` writes the notes on the
# GitHub Release page. They are deliberately different documents: the
# changelog is history, regenerated in full on every release and committed,
# so it must render identically on a laptop and in CI — nothing here reaches
# the GitHub API, and PR links come from the `(#N)` that squash merges leave
# in the subject rather than from a lookup that needs a token.

[changelog]
header = """
# Changelog

All notable changes to UZE are documented here, generated from Conventional
Commits by `git-cliff` (`make changelog`). Until v1, UZE ships only SemVer
pre-releases — see `docs/versioning.md`.
"""
# A changelog nobody can navigate is a list of sentences. Every short SHA is a
# link to its commit, every `(#N)` is a link to the pull request that carried
# the change, the scope leads the line so a reader can scan for the area they
# care about, and every version heading is the diff against the one before it
# — which is the question a reader actually arrives with.
body = """
{% set repo = "https://github.com/hiukky/uze" %}\
{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/compare/{{ previous.version }}...{{ version }})\
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}]({{ repo }}/releases/tag/{{ version }})\
    {% endif %}\
    {%- if timestamp %} - {{ timestamp | date(format="%Y-%m-%d") }}{% endif %}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}

{% for commit in commits %}\
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
    {%- if commit.breaking %} [**breaking**]{% endif %} \
    ([{{ commit.id | truncate(length=7, end="") }}]({{ repo }}/commit/{{ commit.id }}))
{% endfor %}\
{% endfor %}
"""
trim = true
footer = ""
# Squash merges leave `(#N)` in the subject, which is a pull request number
# every reader recognises and nobody can click. Rewriting it after rendering
# keeps the link offline-derivable: no API call, no token, and `make
# changelog` on a laptop produces the same bytes CI commits.
postprocessors = [
  { pattern = '\(#(\d+)\)', replace = "([#${1}](https://github.com/hiukky/uze/pull/${1}))" },
  # The conditional blocks above leave their own blank lines behind; one blank
  # line between blocks is what Markdown means by a paragraph break.
  # Releases are rendered one at a time and joined without a blank line
  # between them, which glued the last entry of one release to the heading of
  # the next. Postprocessors run on each release body after it is trimmed, so
  # the separator has to be added at the front of the body — which is why the
  # header above no longer ends with a blank line of its own.
  { pattern = '^(## \[)', replace = "\n${1}" },
  { pattern = '\n{3,}', replace = "\n\n" },
]

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

# Matches the types actually used in this repo's history (feat, fix, chore,
# docs, refactor, test, style, ci). The `<!-- nn -->` prefixes are sort keys:
# `group_by` orders alphabetically, which put CI above Features, and the
# template's `striptags` removes them again before printing. Two digits,
# zero-padded, because `<!-- 10 -->` sorts before `<!-- 2 -->`.
commit_parsers = [
  # Merge commits repeat a change already listed by the commit it merged, and
  # their multi-line subject drags the pull request title into the list a
  # second time.
  { message = "^Merge (pull request|branch|remote-tracking)", skip = true },
  { message = "^feat", group = "<!-- 00 -->Features" },
  { message = "^fix", group = "<!-- 01 -->Fixes" },
  { message = "^perf", group = "<!-- 02 -->Performance" },
  { message = "^refactor", group = "<!-- 03 -->Refactor" },
  { message = "^docs", group = "<!-- 04 -->Documentation" },
  { message = "^test", group = "<!-- 05 -->Tests" },
  { message = "^ci", group = "<!-- 06 -->CI" },
  # Dependency bumps are mostly Dependabot's, and a reader scanning for what
  # the maintainers changed should not have to step over them.
  { message = "^chore\\(deps", group = "<!-- 07 -->Dependencies" },
  { message = "^build\\(deps", group = "<!-- 07 -->Dependencies" },
  # `chore(release): ...` commits are the release-bump commits themselves;
  # skipped so a release entry never lists its own bump.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^chore", group = "<!-- 08 -->Chore" },
  { message = "^style", group = "<!-- 09 -->Style" },
  { message = ".*", group = "<!-- 10 -->Other" },
]
