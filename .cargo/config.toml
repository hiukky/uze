# The workspace builds and tests a large number of real subprocesses. On
# WSL2, Cargo's default of one `rustc` per logical CPU combines badly with the
# test harness's own concurrency and can restart the VM. Keep compilation
# bounded by default; CI can opt into a different value per job.
#
# Test threads default to num_cpus::get(). Override with
# `RUST_TEST_THREADS=N` on hosts that need to cap it (e.g. memory-constrained WSL).
[build]
jobs = 2
