# This project's agent environment. UZE reads this file; it writes
# agents.lock, which you never edit.

worktrees:
  # Every agent launched here gets a checkout of its own, which is what
  # this repository has always done and what its own "Concurrent work
  # isolation" section tells an agent to expect. Undeclared, an agent
  # would start in the operator's checkout and be isolated only when
  # somebody asked.
  default: isolated

  # UZE rebases an agent's branch onto the target, runs the checks, pushes
  # it, and asks the agent to open the request. Projected into AGENTS.md's
  # "Concurrent work isolation" section by `uze agent context reconcile`.
  completion: pr

  # An agent names its own work as its first action
  # (`uze agent task name <type>/<subject>`); work that reaches a commit
  # unnamed is named from that commit's subject. Both are judged against
  # this vocabulary — the same one this repository's own history uses.
  branch: conventional

# uze's own architecture, as Mermaid: the workspace's architect surface
# draws these, and its tests draw them too — a diagram here that stops
# routing is a red build.
artifacts:
  path: docs/architecture

# Named by URL, never by a path: a path is one machine's, and this file is
# everyone's. Whoever develops the marketplace reads it from their own
# checkout with `uze market link ai <checkout>`, which touches no file here.
marketplaces:
  ai:
    git: https://github.com/hiukky/ai
    plugins:
      - git
