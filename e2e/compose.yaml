services:
  gateway:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834}
    command:
      - --config
      - /app/uze-conformance-config.yaml
    environment:
      # Deliberately passed only to LiteLLM. Harness containers talk to the
      # internal gateway and never receive provider credentials.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY in the shell or CI secret}
      UZE_CONFORMANCE_LITELLM_MODEL: ${UZE_CONFORMANCE_LITELLM_MODEL:-gpt-4o-mini}
      # Backs the `uze-conformance-reasoning` alias. Claude Code sends
      # `reasoning.effort` for any model name it does not recognize, which a
      # plain chat model rejects with a 400; see litellm-config.yaml.
      UZE_CONFORMANCE_REASONING_MODEL: ${UZE_CONFORMANCE_REASONING_MODEL:-gpt-5}
    volumes:
      - type: bind
        source: ./litellm-config.yaml
        target: /app/uze-conformance-config.yaml
        read_only: true
    networks:
      - conformance
      - provider-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=2)"
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s

  harness:
    profiles: ["manual"]
    build:
      context: ..
      dockerfile: e2e/Dockerfile
      # Latest-channel policy: no harness version args.
      args: {}
    depends_on:
      gateway:
        condition: service_healthy
    environment:
      LITELLM_BASE_URL: http://gateway:4000
      HOME: /work/home
      UZE_HOME: /work/uze-home
    networks:
      - conformance
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000,mode=700
      - /work:rw,noexec,nosuid,size=128m,uid=1000,gid=1000,mode=700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["sh"]

networks:
  conformance:
    internal: true
  # Only LiteLLM joins this network. The harness has no direct Internet route.
  provider-egress: {}
