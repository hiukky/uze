[package]
name = "uze-conformance"
version.workspace = true
edition = "2024"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Deterministic shared test mechanics (single fixture source, safe paths,
# real-home guards) — never harness probing or vendor knowledge.
uze-testkit = { path = "../crates/uze-testkit" }

[lib]
path = "src/lib.rs"

[[bin]]
name = "uze-conformance"
path = "src/main.rs"
