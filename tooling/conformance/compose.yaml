services:
  gateway:
    image: ${LITELLM_IMAGE:-docker.litellm.ai/berriai/litellm@sha256:468c25f35f3e5ec4e414974f00deab93337b1b4d9953cabcfd3722e59415f834}
    command:
      - --config
      - /app/uze-conformance-config.yaml
    environment:
      # Deliberately passed only to LiteLLM. Harness containers talk to the
      # internal gateway and never receive provider credentials.
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in the shell or CI secret}
      UZE_CONFORMANCE_LITELLM_MODEL: ${UZE_CONFORMANCE_LITELLM_MODEL:-groq/llama-3.3-70b-versatile}
    volumes:
      - type: bind
        source: ./litellm-config.yaml
        target: /app/uze-conformance-config.yaml
        read_only: true
    networks:
      - conformance
      - provider-egress
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  harness:
    profiles: ["manual"]
    build:
      context: ../..
      dockerfile: tooling/conformance/Dockerfile
      args:
        CLAUDE_VERSION: ${CLAUDE_VERSION:-2.1.237}
        CODEX_VERSION: ${CODEX_VERSION:-0.148.0}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.18.19}
    depends_on:
      - gateway
    environment:
      LITELLM_BASE_URL: http://gateway:4000
      HOME: /work/home
      UZE_HOME: /work/uze-home
    networks:
      - conformance
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m,uid=1000,gid=1000,mode=700
      - /work:rw,noexec,nosuid,size=128m,uid=1000,gid=1000,mode=700
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    command: ["sh"]

networks:
  conformance:
    internal: true
  # Only LiteLLM joins this network. The harness has no direct Internet route.
  provider-egress: {}
