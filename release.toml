# cargo-release configuration — see docs/versioning.md.
#
# UZE is not published to crates.io; every crate in this workspace stays
# unpublished. `[workspace.package].version` in the root `Cargo.toml` is the
# single version every member shares (`shared-version`), so one release
# bumps them all in lockstep — matching the "single version source" rule
# `docs/versioning.md` already documents.
#
# Usage:
#   cargo release alpha            # dry run: 0.1.0-alpha.N -> 0.1.0-alpha.N+1
#   cargo release alpha --execute  # actually commit + tag
#   cargo release patch|minor|major --execute   # for a real SemVer bump
#
# `push = false` and `publish = false`: this only commits and tags locally.
# Pushing the branch/tag to the remote stays an explicit, separate step.

shared-version = true
consolidate-commits = true
publish = false
push = false
tag = true
tag-name = "v{{version}}"
tag-message = "uze {{version}}"
pre-release-commit-message = "chore(release): bump workspace version to {{version}}"
pre-release-hook = ["make", "check"]
