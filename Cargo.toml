[package]
name = "uze"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Standards-first agent project composition"
license.workspace = true
authors.workspace = true
# UZE is not published to crates.io. Native Cargo field (independent of
# cargo-release's own `publish = false` in release.toml) so `cargo publish`
# itself refuses, and its manifest-completeness checks (repository/
# homepage/documentation, path-dependency versions) never block a release.
publish = false

[workspace]
members = [
  ".",
  "crates/uze-core",
  "crates/uze-integrations",
  "crates/uze-application",
  "crates/uze-extensions",
  "crates/uze-git",
  "crates/uze-testkit",
  "crates/uze-terminal",
  "crates/uze-theme",
]
default-members = ["."]
resolver = "3"

[workspace.package]
# UZE v0 is released as SemVer pre-releases. Increment this value before
# producing any distributable binary; every workspace crate inherits it.
version = "0.0.0-alpha.1"
license = "Apache-2.0"
authors = ["Romullo Sousa (hiukky)"]

# Test binaries do not ship, and full DWARF data materially increases their
# compile and link time. Keep developer builds debuggable while making the
# frequently-run test profile lighter.
[profile.test]
debug = 0

[dependencies]
uze-core = { path = "crates/uze-core" }
uze-integrations = { path = "crates/uze-integrations" }
uze-application = { path = "crates/uze-application" }
uze-extensions = { path = "crates/uze-extensions" }
uze-git = { path = "crates/uze-git" }
uze-terminal = { path = "crates/uze-terminal" }
uze-theme = { path = "crates/uze-theme" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ratatui = "0.30"
crossterm = "0.29"
indicatif = "0.18"
# CLI presentation kit: anstyle is the same style engine `clap`'s own
# Styles builder uses, so the text `progress` renders and the errors/usage
# `clap` renders share one palette instead of two hand-maintained ones.
# dialoguer replaces raw `stdin().read_line()` prompts with proper
# confirm/select/input widgets; comfy-table replaces hand-padded columns.
anstyle = "1"
dialoguer = "0.11"
comfy-table = "7"

# MCP fixtures and the local playground server are test/development support;
# neither is linked into UZE's application/core crates.
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"

[dev-dependencies]
# Shared test infrastructure (TestEnvironment, FakeHarness, fixtures,
# scenario builder) — see crates/uze-testkit and tests/README.md.
uze-testkit = { path = "crates/uze-testkit" }
# Decodes the terminal runtime's wire frames in orchestrator.rs tests —
# see uze-terminal's own bincode dependency for why the wire uses it.
bincode = "1.3"

[[bin]]
name = "uze-mcp-conformance-fixture"
path = "tests/_fixtures/bin/mcp_conformance_fixture.rs"

[[bin]]
name = "playground-mcp"
path = "playground/mcp_server.rs"
