[package]
name = "uze"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Standards-first agent project composition"
license = "MIT"
# UZE is not published to crates.io. Native Cargo field (independent of
# cargo-release's own `publish = false` in release.toml) so `cargo publish`
# itself refuses, and its manifest-completeness checks (repository/
# homepage/documentation, path-dependency versions) never block a release.
publish = false

[workspace]
members = [
  ".",
  "crates/uze-core",
  "crates/uze-integrations",
  "crates/uze-application",
  "crates/uze-testkit",
  "e2e",
]
default-members = ["."]
resolver = "3"

[workspace.package]
# UZE v0 is released as SemVer pre-releases. Increment this value before
# producing any distributable binary; every workspace crate inherits it.
version = "0.0.0-alpha.14"

[dependencies]
uze-core = { path = "crates/uze-core" }
uze-integrations = { path = "crates/uze-integrations" }
uze-application = { path = "crates/uze-application" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ratatui = "0.30"
crossterm = "0.29"
indicatif = "0.17"

# MCP fixtures and the local playground server are test/development support;
# neither is linked into UZE's application/core crates.
rmcp = { version = "3", features = ["server", "transport-io", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1"

[dev-dependencies]
# Shared test infrastructure (TestEnvironment, FakeHarness, fixtures,
# scenario builder) — see crates/uze-testkit and tests/README.md.
uze-testkit = { path = "crates/uze-testkit" }

[[bin]]
name = "uze-mcp-conformance-fixture"
path = "e2e/_fixtures/bin/mcp_conformance_fixture.rs"

[[bin]]
name = "playground-mcp"
path = "playground/mcp_server.rs"
