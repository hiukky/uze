[package]
name = "uze"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Standards-first agent project composition"
license.workspace = true
authors.workspace = true
# UZE is not published to crates.io. Native Cargo field (independent of
# cargo-release's own `publish = false` in release.toml) so `cargo publish`
# itself refuses, and its manifest-completeness checks (repository/
# homepage/documentation, path-dependency versions) never block a release.
publish = false

[workspace]
members = [
  ".",
  "crates/uze-core",
  "crates/uze-integrations",
  "crates/uze-application",
  "crates/uze-extensions",
  "crates/uze-git",
  "crates/uze-testkit",
  "crates/uze-terminal",
  "crates/uze-theme",
  "crates/uze-keys",
]
default-members = ["."]
resolver = "3"

[workspace.package]
# UZE v0 is released as SemVer pre-releases. Increment this value before
# producing any distributable binary; every workspace crate inherits it.
version = "0.0.0-alpha.4"
license = "Apache-2.0"
authors = ["Romullo Sousa (hiukky)"]

# Test binaries do not ship, and full DWARF data materially increases their
# compile and link time. Keep developer builds debuggable while making the
# frequently-run test profile lighter.
[profile.test]
debug = 0

[dependencies]
uze-core = { path = "crates/uze-core" }
uze-integrations = { path = "crates/uze-integrations" }
uze-application = { path = "crates/uze-application" }
uze-extensions = { path = "crates/uze-extensions" }
uze-git = { path = "crates/uze-git" }
uze-terminal = { path = "crates/uze-terminal" }
uze-theme = { path = "crates/uze-theme" }
uze-keys = { path = "crates/uze-keys" }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# The updater verifies a release archive the way `install.sh` does. Already
# in the tree through `uze-core`'s package digests.
sha2 = "0.11"
thiserror = "2"
ratatui = "0.30"
crossterm = "0.29"
indicatif = "0.18"
# CLI presentation kit: anstyle is the same style engine `clap`'s own
# Styles builder uses, so the text `progress` renders and the errors/usage
# `clap` renders share one palette instead of two hand-maintained ones.
# dialoguer replaces raw `stdin().read_line()` prompts with proper
# confirm/select/input widgets; comfy-table replaces hand-padded columns.
anstyle = "1"
dialoguer = "0.12"
comfy-table = "8"
# One call, in `main`: restoring the default SIGPIPE disposition Rust's
# runtime ignores, so `uze … | head` ends quietly instead of panicking.
# Already in the tree through `uze-core` and `uze-terminal`.
libc = "0.2"

# The MCP conformance fixture and the local playground server. Optional, and
# activated only by `dev-servers` below: `[dependencies]` applies to every
# target of a package, so as plain entries these three were compiled into the
# shipped `uze` on all six release targets, listed in the SBOM the release
# signs as "what is in here", and answered for by `cargo deny` and
# `cargo audit` — a full async runtime and an MCP server the product does not
# use. No production source in `src/` or `crates/` names any of them.
rmcp = { version = "3", features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"], optional = true }
schemars = { version = "1", optional = true }

# Spans around each command and each TUI worker; already in the tree
# through `rmcp`, and a no-op until a subscriber is installed. The text
# subscriber (`UZE_LOG`) is always compiled; the OTLP exporter is the
# `telemetry` feature, which the release matrix does not enable — see
# `src/telemetry.rs` and `docs/observability.md`.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
opentelemetry = { version = "0.32", optional = true }
opentelemetry_sdk = { version = "0.32", optional = true }
opentelemetry-otlp = { version = "0.32", optional = true, default-features = false, features = ["trace", "http-proto", "reqwest-blocking-client"] }
tracing-opentelemetry = { version = "0.33", optional = true }

[features]
# Export every span over OTLP/HTTP to `OTEL_EXPORTER_OTLP_ENDPOINT`
# (`make observe` starts a Jaeger that listens). Sixty-odd pure-Rust
# crates, wanted on a developer's machine and nowhere else.
telemetry = [
  "dep:opentelemetry",
  "dep:opentelemetry_sdk",
  "dep:opentelemetry-otlp",
  "dep:tracing-opentelemetry",
]

# The two non-shipping `[[bin]]` targets below, and nothing else. Named as a
# feature rather than moved to `[dev-dependencies]` because a `[[bin]]` cannot
# use one; the self dev-dependency below is what turns it on for `cargo test`,
# so the suite still builds the fixture without anybody passing a flag.
dev-servers = ["dep:rmcp", "dep:tokio", "dep:schemars"]

[dev-dependencies]
# UZE depending on itself, only to say that a test build wants `dev-servers`.
# Dev-dependencies are absent from `cargo build --release --bin uze`, which is
# exactly the distinction being drawn: the fixture binaries exist for the
# suite and must never reach the artifact a user downloads.
uze = { path = ".", features = ["dev-servers"] }
# Shared test infrastructure (TestEnvironment, FakeHarness, fixtures,
# scenario builder) — see crates/uze-testkit and tests/README.md.
uze-testkit = { path = "crates/uze-testkit" }
# Decodes the terminal runtime's wire frames in orchestrator.rs tests — see
# uze-terminal's own bincode dependency for why the wire uses it and why the
# version is pinned exactly. A decoder that drifts from the encoder proves
# nothing, so these two move together or not at all.
bincode = "=1.3.3"

[[bin]]
name = "uze-mcp-conformance-fixture"
path = "tests/_fixtures/bin/mcp_conformance_fixture.rs"
required-features = ["dev-servers"]

[[bin]]
name = "playground-mcp"
path = "playground/mcp_server.rs"
required-features = ["dev-servers"]
