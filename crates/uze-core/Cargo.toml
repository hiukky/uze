[package]
name = "uze-core"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Harness-agnostic package, capability, lifecycle, and integration contracts for UZE"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = { version = "0.0.28", features = ["compat-serde-yaml"] }
thiserror = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
uze-testkit = { path = "../uze-testkit" }
