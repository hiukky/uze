[package]
name = "uze-application"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Package-centric UZE product application facade"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
uze-core = { path = "../uze-core" }
uze-keys = { path = "../uze-keys" }
uze-integrations = { path = "../uze-integrations" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Already in the tree through `rmcp`; spans on the read paths and the
# bootstrap are no-ops until a subscriber is installed.
tracing = "0.1"

[dev-dependencies]
# A capturing subscriber, for the tests that assert on the spans a call
# produces.
tracing-subscriber = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
uze-testkit = { path = "../uze-testkit" }
