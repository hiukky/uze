[package]
name = "uze-application"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Package-centric UZE product application facade"
license = "MIT"
publish = false

[dependencies]
uze-core = { path = "../uze-core" }
uze-integrations = { path = "../uze-integrations" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
