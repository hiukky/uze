[package]
name = "uze-terminal"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Local persistent terminal runtime for UZE workspaces"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Spans on every process this crate runs; a no-op until the binary
# subscribes (see `src/telemetry.rs`).
tracing = "0.1"
alacritty_terminal = "0.26"
portable-pty = "0.9"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# Pinned exactly, and not a candidate for updating. 1.3.3 is the last 1.x and
# has been since 2021; 2.x is a different encoder API, and the frames on this
# wire are versioned, so moving it is a protocol change that gets designed,
# not a bump. 3.0.0 is not even a crate — its whole lib.rs is
# `compile_error!("https://xkcd.com/2347/")`, published by an account since
# deleted. `.github/dependabot.yml` keeps the robot away from all three.
bincode = "=1.3.3"
thiserror = "2"

[dev-dependencies]
uze-testkit = { path = "../uze-testkit" }
