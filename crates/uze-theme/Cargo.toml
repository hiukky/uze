[package]
name = "uze-theme"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "UZE's design vocabulary: colour tokens, named symbols, and the theme schema they resolve against"
license.workspace = true
authors.workspace = true
publish = false

[dev-dependencies]
# Only to prove `BUNDLED_SYNTAX_THEMES` still matches what syntect bundles.
# Production code here names no rendering or highlighting library.
syntect = "5"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Resolving a symbol's display width is what lets a theme replace a glyph
# without every row that draws it having to know the new width.
unicode-width = "0.2"
