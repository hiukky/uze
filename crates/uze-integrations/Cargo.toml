[package]
name = "uze-integrations"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Peer harness integrations for UZE"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Spans on every process this crate runs; a no-op until the binary
# subscribes (see `src/telemetry.rs`).
tracing = "0.1"
uze-core = { path = "../uze-core" }
serde_json = "1"
toml_edit = "0.25.13"

[dev-dependencies]
uze-testkit = { path = "../uze-testkit" }
