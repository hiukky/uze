[package]
name = "uze-integrations"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "Peer harness integrations for UZE"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Spans on every process this crate runs; a no-op until the binary
# subscribes (see `src/telemetry.rs`).
tracing = "0.1"
uze-core = { path = "../uze-core" }
# `preserve_order` backs `Value`'s maps with an IndexMap instead of a
# BTreeMap. Every JSON config UZE merges into is a file the *user* owns and
# organised; without it a read-modify-write re-emits their whole document
# alphabetically. Declared on every crate of the workspace so a single-crate
# build behaves like the whole one. It costs no new supply chain: indexmap
# is already compiled in through noyalib, rmcp and syntect.
serde_json = { version = "1", features = ["preserve_order"] }
toml_edit = "0.25.13"

[dev-dependencies]
uze-testkit = { path = "../uze-testkit" }
