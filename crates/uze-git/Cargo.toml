[package]
name = "uze-git"
version.workspace = true
edition = "2024"
rust-version = "1.97"
description = "One transport for speaking to the Git binary"
license.workspace = true
authors.workspace = true
publish = false

[dependencies]
# Spans on every process this crate runs; a no-op until the binary
# subscribes (see `src/telemetry.rs`).
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# A capturing subscriber, for the tests that assert on the spans a call
# produces.
tracing-subscriber = "0.3"
uze-testkit = { path = "../uze-testkit" }
