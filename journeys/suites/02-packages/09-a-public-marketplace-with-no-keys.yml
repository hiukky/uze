journey: a public marketplace installs on a machine with no key, whatever spelling the project used
tags: [gate, cli, packages]
proves: web/content/docs/project-files.mdx
about: |
  A contributor clones a project and runs `uze install` on a machine with no
  SSH key, no agent and no credential helper. The marketplace is public, so
  anonymous HTTPS is all it takes — and the manifest spells it the way an
  older lock or a hand-written file might, with a `.git` suffix, which UZE
  records in its one canonical spelling.

world:
  project: demo-app
  standins: [claude]
  files:
    market/marketplace.json: |
      {
        "name": "demo",
        "plugins": [{ "name": "flow", "source": "plugins/flow" }]
      }
    market/plugins/flow/plugin.json: |
      {
        "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
        "name": "flow",
        "description": "Canonical: one package, no vendor manifests."
      }
    market/plugins/flow/skills/commit/SKILL.md: |
      ---
      name: commit
      description: Write a commit message from the staged diff.
      ---

      The body a harness would read.
    forge/serve.py: |
      # A smart-HTTP Git forge on loopback: `git http-backend` behind Basic
      # auth when a credential is given, anonymous when it is not. Writes
      # the port it took, since a fixed one could collide with anything.
      import base64, http.server, os, subprocess, sys

      root, port_file = sys.argv[1], sys.argv[2]
      credential = sys.argv[3] if len(sys.argv) > 3 else None
      expected = credential and "Basic " + base64.b64encode(credential.encode()).decode()

      class Forge(http.server.BaseHTTPRequestHandler):
          def log_message(self, *args):
              pass

          def do_GET(self):
              self.serve()

          def do_POST(self):
              self.serve()

          def serve(self):
              if expected and self.headers.get("Authorization") != expected:
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="forge"')
                  self.send_header("Content-Length", "0")
                  self.end_headers()
                  return
              path, _, query = self.path.partition("?")
              body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
              env = {
                  "PATH": os.environ["PATH"],
                  "GIT_PROJECT_ROOT": root,
                  "GIT_HTTP_EXPORT_ALL": "1",
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_CONFIG_GLOBAL": "/dev/null",
                  "GIT_CONFIG_COUNT": "2",
                  "GIT_CONFIG_KEY_0": "uploadpack.allowFilter",
                  "GIT_CONFIG_VALUE_0": "true",
                  "GIT_CONFIG_KEY_1": "uploadpack.allowAnySHA1InWant",
                  "GIT_CONFIG_VALUE_1": "true",
                  "REQUEST_METHOD": self.command,
                  "PATH_INFO": path,
                  "QUERY_STRING": query,
                  "CONTENT_TYPE": self.headers.get("Content-Type", ""),
                  "CONTENT_LENGTH": str(len(body)),
                  "REMOTE_ADDR": "127.0.0.1",
              }
              for header, variable in (
                  ("Content-Encoding", "HTTP_CONTENT_ENCODING"),
                  ("Git-Protocol", "GIT_PROTOCOL"),
              ):
                  if self.headers.get(header):
                      env[variable] = self.headers[header]
              answer = subprocess.run(
                  ["git", "http-backend"], input=body, env=env, capture_output=True
              ).stdout
              head, separator, payload = answer.partition(b"\r\n\r\n")
              if not separator:
                  head, separator, payload = answer.partition(b"\n\n")
              status, headers = 200, []
              for line in head.decode().splitlines():
                  key, _, value = line.partition(":")
                  if key.lower() == "status":
                      status = int(value.split()[0])
                  elif value:
                      headers.append((key, value.strip()))
              self.send_response(status)
              for key, value in headers:
                  self.send_header(key, value)
              self.send_header("Content-Length", str(len(payload)))
              self.end_headers()
              self.wfile.write(payload)

      server = http.server.ThreadingHTTPServer(("127.0.0.1", 0), Forge)
      with open(port_file + ".partial", "w") as written:
          written.write(str(server.server_address[1]))
      os.rename(port_file + ".partial", port_file)
      server.serve_forever()
    forge/ssh: |
      #!/bin/sh
      printf '%s\n' "$*" >> "$(dirname "$0")/../forge/ssh.log"
      echo "git@forge: Permission denied (publickey)." >&2
      exit 255

scenes:
  - scene: a public repository needs nothing but the network
    when:
      - shell: "{uze} setup"
        say: provision every registered harness
        check: false
      - shell: |
          set -e
          mkdir -p {world}/forge/team
          git clone -q --bare {world}/market {world}/forge/team/plugins
          cp {world}/forge/ssh {world}/bin/ssh && chmod +x {world}/bin/ssh
          nohup {python} {world}/forge/serve.py {world}/forge {world}/forge/port \
            >{world}/forge/serve.log 2>&1 </dev/null &
        say: a public forge
      - shell: |
          for attempt in $(seq 1 100); do
            [ -s {world}/forge/port ] && exit 0
            sleep 0.2
          done
          echo "the forge never took a port:" >&2
          cat {world}/forge/serve.log >&2
          exit 1
        say: wait for the forge, and say why when it does not come up
      - shell: |
          set -e
          printf 'marketplaces:\n  demo:\n    git: http://127.0.0.1:%s/team/plugins.git\n    plugins:\n      - flow\n' \
            "$(cat {world}/forge/port)" > {project}/agents.yaml
        say: the project declares the marketplace with a `.git` suffix
      - shell: "GIT_CONFIG_NOSYSTEM=1 {uze} install"
        say: install what agents.yaml declares, with no key anywhere
    then:
      - file: "{home}/.agents/skills/flow:commit/SKILL.md"
        exists: true
        about: the plugin reached the harness
      - file: "{world}/forge/ssh.log"
        exists: false
        about: ssh was never asked — anonymous HTTPS answered
      - file: "{project}/agents.lock"
        contains: "/team/plugins\n"
        about: the lock records the repository without the suffix, in its canonical spelling
