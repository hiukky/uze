journey: a private marketplace is reached with the operator's own key, and the project names it by URL alone
tags: [gate, cli, packages]
proves: web/content/docs/reference/cli.mdx
about: |
  A private repository refuses anonymous HTTPS and has no credential helper
  on this machine, so what reaches it is the operator's SSH agent. The
  person types an alias; what the project records is a full URL no other
  machine needs that alias to read, and nothing in it says how to
  authenticate.

  The forge is on loopback and `ssh` is a stand-in in the world's `bin`:
  a non-root `sshd` can serve only its own user, and the endpoint UZE
  derives is always `git@<host>`. The stand-in serves `git-upload-pack`
  for the forge and refuses without an agent socket, which is how the
  journey knows the socket reached it.

world:
  project: demo-app
  standins: [claude]
  files:
    market/marketplace.json: |
      {
        "name": "demo",
        "plugins": [{ "name": "flow", "source": "plugins/flow" }]
      }
    market/plugins/flow/plugin.json: |
      {
        "$schema": "https://agent-plugins.org/schemas/1.0.0/plugin.schema.json",
        "name": "flow",
        "description": "Canonical: one package, no vendor manifests."
      }
    market/plugins/flow/skills/commit/SKILL.md: |
      ---
      name: commit
      description: Write a commit message from the staged diff.
      ---

      The body a harness would read.
    forge/serve.py: |
      # A smart-HTTP Git forge on loopback: `git http-backend` behind Basic
      # auth when a credential is given, anonymous when it is not. Writes
      # the port it took, since a fixed one could collide with anything.
      import base64, faulthandler, http.server, os, socketserver, subprocess, sys

      # Where it stood, in serve.log, if it has not taken a port by then.
      faulthandler.dump_traceback_later(8)

      root, port_file = sys.argv[1], sys.argv[2]
      credential = sys.argv[3] if len(sys.argv) > 3 else None
      expected = credential and "Basic " + base64.b64encode(credential.encode()).decode()

      class Forge(http.server.BaseHTTPRequestHandler):
          def log_message(self, *args):
              pass

          def do_GET(self):
              self.serve()

          def do_POST(self):
              self.serve()

          def serve(self):
              if expected and self.headers.get("Authorization") != expected:
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="forge"')
                  self.send_header("Content-Length", "0")
                  self.end_headers()
                  return
              path, _, query = self.path.partition("?")
              body = self.rfile.read(int(self.headers.get("Content-Length") or 0))
              env = {
                  "PATH": os.environ["PATH"],
                  "GIT_PROJECT_ROOT": root,
                  "GIT_HTTP_EXPORT_ALL": "1",
                  "GIT_CONFIG_NOSYSTEM": "1",
                  "GIT_CONFIG_GLOBAL": "/dev/null",
                  "GIT_CONFIG_COUNT": "2",
                  "GIT_CONFIG_KEY_0": "uploadpack.allowFilter",
                  "GIT_CONFIG_VALUE_0": "true",
                  "GIT_CONFIG_KEY_1": "uploadpack.allowAnySHA1InWant",
                  "GIT_CONFIG_VALUE_1": "true",
                  "REQUEST_METHOD": self.command,
                  "PATH_INFO": path,
                  "QUERY_STRING": query,
                  "CONTENT_TYPE": self.headers.get("Content-Type", ""),
                  "CONTENT_LENGTH": str(len(body)),
                  "REMOTE_ADDR": "127.0.0.1",
              }
              for header, variable in (
                  ("Content-Encoding", "HTTP_CONTENT_ENCODING"),
                  ("Git-Protocol", "GIT_PROTOCOL"),
              ):
                  if self.headers.get(header):
                      env[variable] = self.headers[header]
              answer = subprocess.run(
                  ["git", "http-backend"], input=body, env=env, capture_output=True
              ).stdout
              head, separator, payload = answer.partition(b"\r\n\r\n")
              if not separator:
                  head, separator, payload = answer.partition(b"\n\n")
              status, headers = 200, []
              for line in head.decode().splitlines():
                  key, _, value = line.partition(":")
                  if key.lower() == "status":
                      status = int(value.split()[0])
                  elif value:
                      headers.append((key, value.strip()))
              self.send_response(status)
              for key, value in headers:
                  self.send_header(key, value)
              self.send_header("Content-Length", str(len(payload)))
              self.end_headers()
              self.wfile.write(payload)

      class Server(http.server.ThreadingHTTPServer):
          # `HTTPServer.server_bind` asks `socket.getfqdn`, a reverse lookup
          # that stalls on a macOS runner long enough to never take a port.
          def server_bind(self):
              socketserver.TCPServer.server_bind(self)
              self.server_name = "127.0.0.1"
              self.server_port = self.server_address[1]

      server = Server(("127.0.0.1", 0), Forge)
      with open(port_file + ".partial", "w") as written:
          written.write(str(server.server_address[1]))
      os.rename(port_file + ".partial", port_file)
      faulthandler.cancel_dump_traceback_later()
      server.serve_forever()
    forge/ssh: |
      #!/bin/sh
      printf '%s\n' "$*" >> "$(dirname "$0")/../forge/ssh.log"
      [ "$1" = "-G" ] && exit 0
      if [ -z "$SSH_AUTH_SOCK" ]; then
        echo "git@forge: Permission denied (publickey)." >&2
        exit 255
      fi
      for last; do :; done
      path=${last#* }
      path=$(printf '%s' "$path" | tr -d "'")
      root="$(dirname "$0")/../forge"
      [ -d "$root/$path" ] || path=${path%.git}
      exec git -c uploadpack.allowFilter=true -c uploadpack.allowAnySHA1InWant=true upload-pack "$root/$path"

scenes:
  - scene: the operator's key reaches a repository HTTPS refuses
    when:
      - shell: "{uze} setup"
        say: provision every registered harness
        check: false
      - shell: |
          set -e
          mkdir -p {world}/forge/team
          git clone -q --bare {world}/market {world}/forge/team/plugins
          cp {world}/forge/ssh {world}/bin/ssh && chmod +x {world}/bin/ssh
          nohup {python} {world}/forge/serve.py {world}/forge {world}/forge/port user:s3cret \
            >{world}/forge/serve.log 2>&1 </dev/null &
        say: a private forge, reachable only with credentials this machine's Git has none of
      - shell: |
          for attempt in $(seq 1 100); do
            [ -s {world}/forge/port ] && exit 0
            sleep 0.2
          done
          echo "the forge never took a port:" >&2
          cat {world}/forge/serve.log >&2
          exit 1
        say: wait for the forge, and say why when it does not come up
      - shell: 'GIT_CONFIG_NOSYSTEM=1 {uze} market host work "http://127.0.0.1:$(cat {world}/forge/port)"'
        say: name the forge `work`
      - shell: "GIT_CONFIG_NOSYSTEM=1 SSH_AUTH_SOCK={world}/agent.sock {uze} market add work:team/plugins"
        say: add the marketplace by its alias, with a key in the agent
      - shell: "GIT_CONFIG_NOSYSTEM=1 SSH_AUTH_SOCK={world}/agent.sock {uze} flow@demo"
        say: add its plugin to the project
    then:
      - file: "{home}/.agents/skills/flow:commit/SKILL.md"
        exists: true
        about: the plugin reached the harness from a repository only SSH could read
      - file: "{world}/forge/ssh.log"
        contains: "BatchMode=yes"
        about: ssh was the transport, and it was told never to prompt
      - file: "{world}/forge/ssh.log"
        contains: "StrictHostKeyChecking=yes"
        about: nor to offer a key to a host the operator never accepted
      - file: "{uze_home}/cache/marketplaces/demo/repo/transport.json"
        contains: "git@127.0.0.1:team/plugins.git"
        about: the transport that answered is remembered, so the next fetch starts there
      - file: "{project}/agents.yaml"
        contains: "http://127.0.0.1:"
        about: the manifest holds the full URL
      - file: "{project}/agents.yaml"
        excludes: "work:"
        about: not the alias, which only this machine knows
      - file: "{project}/agents.lock"
        contains: "/team/plugins"
        about: the lock records the same repository
      - file: "{project}/agents.lock"
        excludes: "git@"
        about: in its canonical spelling, never the transport that happened to answer
