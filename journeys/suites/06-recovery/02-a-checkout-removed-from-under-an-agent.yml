journey: a checkout deleted from under an agent costs the checkout, never the work
tags: [gate, tui, recovery]
proves: web/content/docs/workspace.mdx
about: |
  Checkouts get deleted. A cleanup script, a full disk, a person tidying
  `.worktrees` by hand — and the agent that was working there is suddenly
  standing on nothing.

  What must survive is the work, and it does, because the commits were never
  in the checkout to begin with: they are on a branch in the repository the
  checkout was a view of. The workspace's job is to say so plainly instead of
  showing a broken row, and to be able to give the task somewhere to stand
  again — with its branch as it stands, not re-cut from the target, which
  would silently throw away exactly what was being protected.

  This is also the journey that holds the *detection* honest, and it took a
  second platform to show why. Nothing announces a deleted directory. On
  Linux the workspace was told by accident: `/proc` starts spelling a removed
  cwd `<path> (deleted)`, the pane's reading therefore changed, and a changed
  reading is what makes the server speak. Where a kernel has no such spelling
  the reading simply stops resolving, nothing changes, no event is sent — and
  the row went on offering a way into a directory that was gone. The answer
  has to come from the disk on a clock, and a unit test cannot tell the two
  apart, because on Linux both look the same.

world:
  project: demo-app
  manifest: |
    worktrees:
      target: main
      completion: handoff
      slots: 3

scenes:
  - scene: an agent with work committed in its own checkout
    when:
      - open: "{uze}"
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "│"
        in: strip
        occurrence: 2
        offset: 2
        expect: new agent
      - click: " new agent "
        say: place an agent
        in: pane
        row_offset: 1
        offset: 3
        expect: Claude Code v
        expect_timeout: 45
        pause: 1.5
      - shell: |
          set -e
          slot=$(ls -d {project}/.worktrees/*/ | head -1)
          printf 'work in progress\n' > "$slot/notes.md"
          git -C "$slot" add -A
          git -C "$slot" commit -qm 'feat: work nobody wants to lose'
        say: it commits something worth keeping
    then:
      - tasks: { count: 1 }
      - git: { branches: "agent/*", count: 1 }
        about: one task, on one branch of its own
      - dir: "{project}/.worktrees/*"
        count: 1

  - scene: the checkout is deleted from under it
    when:
      - shell: |
          set -e
          rm -rf {project}/.worktrees/*
          git -C {project} worktree prune
        say: delete the checkout the way a cleanup script would
      - wait: screen
        until: checkout removed
        in: sidebar
        # A removed checkout is one of the things `TASK_REFRESH` exists to
        # notice (its doc comment says so), and that timer is 20 seconds.
        # Forty was two of them, so a deletion landing just after a tick had
        # to be caught by the very next one. Three intervals, so the wait is
        # bounded by the cadence rather than racing it.
        timeout: 70
        settle: 1.0
        say: the workspace says what happened instead of showing a broken row
    then:
      - dir: "{project}/.worktrees/*"
        count: 0
        about: the checkout really is gone
      - tasks: { count: 1 }
        about: the task is not forgotten with it
      - git: { branches: "agent/*", count: 1 }
        about: and its branch is still in the repository
      - cmd:
          run: "git -C {project} log --oneline --all"
          stdout_contains: "feat: work nobody wants to lose"
        about: |
          with the commit on it — the work was never in the checkout, which
          is why deleting the checkout could not take it

  - scene: resuming gives the task somewhere to stand, with its branch as it stands
    when:
      # The row says `checkout removed` before it offers the way back in,
      # and the gap between the two is a repository evaluation: noticing the
      # loss is what schedules it, and only its answer strips the task of a
      # checkout it no longer has — which is what `resume` is gated on.
      # Waited for rather than assumed, because the two used to arrive
      # together only by accident. On Linux the loss is noticed the instant
      # `/proc` renames the cwd, so the evaluation had long since answered
      # by the time anything looked; where the loss is noticed on a clock,
      # the label and the request are the same moment.
      - wait: screen
        until: resume
        in: sidebar
        timeout: 30
        say: the row offers the way back in, once the repository has answered
      - click: resume
        say: resume the task from its row
        in: sidebar
        expect: new agent
        expect_timeout: 20
      # No band: this picker is anchored under the sidebar row that raised
      # it, not under the tab strip, so it starts left of where `in: pane`
      # begins looking.
      - click: " new agent "
        say: pick a harness for it to run in again
        row_offset: 1
        offset: 3
        expect: Claude Code v
        expect_timeout: 45
        pause: 2.5
    then:
      - dir: "{project}/.worktrees/*"
        count: 1
        about: a checkout exists again
      - tasks: { count: 1 }
        about: and it is the same task, not a second one standing in for it
      - git: { branches: "agent/*", count: 1 }
        about: on the same single branch
      - cmd:
          run: "git -C {project} log --oneline --all"
          stdout_contains: "feat: work nobody wants to lose"
        about: |
          still carrying the commit — the branch was checked out as it stood,
          never re-cut from the target, which would have discarded the work
          this whole scene exists to keep
      - tasks: { any_state: ready }
        about: and the task is deliverable again, exactly as it was
