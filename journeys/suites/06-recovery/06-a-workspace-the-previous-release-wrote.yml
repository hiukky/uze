journey: a workspace the previous release wrote opens on this build rather than lying
tags: [gate, tui, recovery]
proves: web/content/docs/workspace.mdx
about: |
  The terminal runtime persists the shape of the workspace — the spaces,
  their roots, their tabs — under UZE's own state directory, and that
  document outlives the binary that wrote it: installing a newer UZE
  replaces the binary, never the state.

  The previous release wrote a kind per space. This build has no field
  for one, and a parser that simply drops what it does not know would
  restore every space as something the operator never chose. So the
  version is read before the document: a workspace from another build is
  set aside whole, and uze opens on the directory it was started in.

  What the machine must show: the old bytes are still there under a name
  nothing reads as a workspace, the current document is this build's own,
  and the operator can create an agent — the product is not wedged by a
  file they never wrote.

world:
  project: demo-app
  manifest: |
    worktrees:
      target: main
      completion: handoff
      slots: 2

scenes:
  - scene: the state directory holds a workspace the previous release wrote
    when:
      - shell: |
          set -e
          mkdir -p {uze_home}/state/terminal
          cat > {uze_home}/state/terminal/workspace.json <<'JSON'
          {"spaces":[{"label":"from-before","root":"/gone","kind":"worktree","tabs":[]}]}
          JSON
        say: a workspace of the previous shape, rooted at a directory that no longer exists
    then:
      - file: "{uze_home}/state/terminal/workspace.json"
        contains: '"kind"'
        about: the document carries a field this build has no place for
      - cmd:
          run: ls {uze_home}/state/terminal/ | grep -c unreadable || true
          stdout_contains: "0"
        about: and nothing has been set aside yet

  - scene: uze opens on the project, and the old document is kept beside the new one
    when:
      - open: "{uze}"
        say: uze opens, reads the document it cannot use, and starts from the seat it was given
        expect: demo-app
        expect_timeout: 25
        pause: 2.0
      - click: "+ │ ✦"
        say: the product still works — place an agent
        in: strip
        offset: 4
        expect: new agent
      - click: " new agent "
        say: pick Claude Code
        in: pane
        row_offset: 1
        offset: 3
        expect: agent 1
        expect_timeout: 90
        pause: 1.5
    then:
      - cmd:
          run: ls {uze_home}/state/terminal/ | grep -c 'workspace.json.unreadable-'
          stdout_contains: "1"
        about: the bytes uze could not read are kept beside the document
      - cmd:
          run: |
            python3 -c "
            import glob, json
            [kept] = glob.glob('{uze_home}/state/terminal/workspace.json.unreadable-*')
            print(json.load(open(kept))['spaces'][0]['kind'])
            "
          stdout_contains: worktree
        about: unchanged, so nothing about the operator's old workspace was destroyed
      - cmd:
          run: |
            python3 -c "
            import json
            document = json.load(open('{uze_home}/state/terminal/workspace.json'))
            print('schema %d' % document['schema_version'])
            print('\n'.join(space['root'] for space in document['spaces']))
            "
          stdout_contains: "schema 2"
        about: and the document now on that name is this build's own
      - cmd:
          run: |
            python3 -c "
            import json
            document = json.load(open('{uze_home}/state/terminal/workspace.json'))
            print('\n'.join(space['root'] for space in document['spaces']))
            "
          stdout_contains: "{project}"
        about: rooted where uze was started, not at the directory that no longer exists
      - agents: { count: 1, live: 1 }
        about: and the agent the operator asked for was placed
