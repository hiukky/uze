journey: a workspace the previous release wrote opens on this build with its spaces
tags: [gate, tui, recovery]
proves: web/content/docs/workspace.mdx
about: |
  The terminal runtime persists the shape of the workspace — the spaces,
  their roots, their tabs — under UZE's own state directory, and that
  document outlives the binary that wrote it: installing a newer UZE
  replaces the binary, never the state.

  The previous release wrote a kind per space. This build has no field for
  one, and a parser that simply dropped what it did not know would restore
  every space as something the operator never chose. So the shape is read
  before the document — and then it is *climbed*: the kind is dropped
  deliberately, every other field is carried, and the spaces open.

  This is the journey the whole change is named for. The release that moved
  this shape set the document aside instead, and an operator lost every
  space they had open over a difference of one field. What the machine must
  show is the opposite: the spaces are there, nothing was set aside, and
  the document on disk is this build's own.

world:
  project: demo-app
  manifest: |
    worktrees:
      target: main
      completion: handoff
      slots: 2

scenes:
  - scene: the state directory holds a workspace the previous release wrote
    when:
      - shell: |
          set -e
          mkdir -p {uze_home}/state/terminal
          cat > {uze_home}/state/terminal/workspace.json <<'JSON'
          {"spaces":[{"label":"from-before","root":"{project}","kind":"worktree","tabs":[
            {"label":"shell","cwd":"{project}","agent":null,"launch":"Shell"}]}]}
          JSON
        say: a workspace of the previous shape, with a space the operator was working in
    then:
      - file: "{uze_home}/state/terminal/workspace.json"
        contains: '"kind"'
        about: the document carries a field this build has no place for
      - cmd:
          run: ls {uze_home}/state/terminal/ | grep -c unreadable || true
          stdout_contains: "0"
        about: and nothing has been set aside yet

  - scene: uze opens on the workspace it was left, not on the seat it was given
    when:
      - open: "{uze}"
        say: uze opens, carries the document across, and restores what it held
        expect: from-before
        expect_timeout: 25
        pause: 2.0
      - click: "+  ✦"
        say: the product works — place an agent
        in: strip
        offset: 3
        expect: new agent
      - click: " new agent "
        say: pick Claude Code
        in: pane
        row_offset: 1
        offset: 3
        expect: agent 1
        expect_timeout: 90
        pause: 1.5
    then:
      - cmd:
          run: ls {uze_home}/state/terminal/ | grep -c 'workspace.json.unreadable-' || true
          stdout_contains: "0"
        about: nothing was set aside — a shape this build knows is carried, not discarded
      - cmd:
          run: |
            python3 -c "
            import json
            document = json.load(open('{uze_home}/state/terminal/workspace.json'))
            print('schema %d' % document['schema_version'])
            print('kind ' + str(any('kind' in space for space in document['spaces'])))
            "
          stdout_contains: "schema 2"
        about: and the document on that name is now this build's own shape
      - cmd:
          run: |
            python3 -c "
            import json
            document = json.load(open('{uze_home}/state/terminal/workspace.json'))
            print('kind ' + str(any('kind' in space for space in document['spaces'])))
            "
          stdout_contains: "kind False"
        about: with the one field the shapes disagreed about dropped, deliberately
      - cmd:
          run: |
            python3 -c "
            import json
            document = json.load(open('{uze_home}/state/terminal/workspace.json'))
            print('\n'.join(space['label'] for space in document['spaces']))
            "
          stdout_contains: from-before
        about: the space the operator was working in is still there, under its own name
      - agents: { count: 1, live: 1 }
        about: and the agent the operator asked for was placed
