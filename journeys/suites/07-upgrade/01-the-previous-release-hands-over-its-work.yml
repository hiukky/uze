journey: the release a user has installed hands its work to this build
tags: [upgrade, tui, recovery]
proves: web/content/docs/workspace.mdx
about: |
  Every other tier proves this build against a document a test wrote. That
  proves a ladder step and not the claim, which is about two binaries
  meeting on one disk: what the release process actually produced, against
  what this build actually does. A fixture cannot be wrong in the way a
  release can.

  So the previously released `uze` — the one a user would have installed —
  creates the state here: a workspace, an agent, a checkout with a commit
  in it. Then this build opens on the same machine.

  What the machine must show: the agent's branch and its commit are still
  there, the records still name the repository they belong to, and the
  operator can create an agent with no intervening step. Nothing about
  this is checked through UZE's own report; every claim reads Git, the
  filesystem or the records.

world:
  project: demo-app
  released: v0.0.0-alpha.6
  # The manifest the *released* binary understands. `default: isolated`
  # came after it — an agent's isolation moved off the space in the very
  # release this change follows — and a world that spoke only this build's
  # dialect would prove nothing but that the old binary cannot read it.
  manifest: |
    worktrees:
      target: main
      completion: handoff
      slots: 3

scenes:
  - scene: the released binary creates a workspace, an agent and its work
    when:
      - open: "{released_uze}"
        say: the release a user has installed opens on the project
        expect: demo-app
        expect_timeout: 30
        pause: 1.5
      - click: "+ │ ✦"
        say: open the new-agent picker
        in: strip
        offset: 4
        expect: new agent
      - click: " new agent "
        say: pick Claude Code
        in: pane
        row_offset: 1
        offset: 3
        expect: agent 1
        expect_timeout: 90
        pause: 1.5
      - shell: |
          set -e
          slot=$(ls -d {project}/.worktrees/*/ | head -1)
          printf 'pub fn before() {}\n' > "$slot/src/before.rs"
          git -C "$slot" add -A
          git -C "$slot" commit -qm 'feat(api): written by the previous release'
        say: the agent commits work
      - shell: "{released_uze} terminal stop"
        say: the release lets go of the workspace
        check: false
    then:
      - file: "{project}/.worktrees/*/src/before.rs"
        count: 1
        about: the work the previous release's agent did is on disk
      - dir: "{uze_home}/state"
        about: and it left state behind for the next binary to meet

  - scene: this build opens on the same machine and hands the work back
    when:
      - open: "{uze}"
        say: this build opens where the release left off
        expect: demo-app
        expect_timeout: 30
        pause: 2.0
      - click: "+ │ ✦"
        say: the product works — place an agent
        in: strip
        offset: 4
        expect: new agent
      - click: " new agent "
        say: pick Claude Code
        in: pane
        row_offset: 1
        offset: 3
        expect: agent 2
        expect_timeout: 90
        pause: 1.5
    then:
      - file: "{project}/.worktrees/*/src/before.rs"
        count: 1
        about: the previous release's commit is still in its checkout
      - cmd:
          run: git -C {project} branch --list 'agent/*' | wc -l
          stdout_contains: "1"
        about: its branch is still in the repository
      - cmd:
          run: |
            python3 -c "
            import glob, json
            markers = glob.glob('{uze_home}/state/projects/*/project.json')
            print('\n'.join(json.load(open(m))['root'] for m in markers))
            "
          stdout_contains: "{project}"
        about: and the records name the repository they belong to
      - agents: { count: 2, isolated: 1 }
        about: |
          both agents are recorded — and this is the claim the chapter
          exists for. The release wrote its agent under the layout of its
          day; this build read it, carried it into the layout of this one,
          and added its own beside it. One of the two is isolated, which is
          the release's: this build placed its own in the project's root,
          because that is what this manifest asks for and the manifest is
          the release's too.
      - cmd:
          run: |
            python3 -c "
            import glob, json
            agents = [a for s in glob.glob('{uze_home}/state/projects/*/agents.json')
                      for a in json.load(open(s))['agents'] if a.get('isolation')]
            print('\n'.join(a['isolation']['branch'] for a in agents))
            "
          stdout_contains: "agent/"
        about: and the carried record still names the branch its work is on
