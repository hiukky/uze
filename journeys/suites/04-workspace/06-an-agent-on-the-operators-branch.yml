journey: an agent starts on the operator's own branch, beside them
tags: [gate, tui, workspace]
proves: web/content/docs/workspace/agents.mdx
about: |
  A space is a directory and nothing else. An agent started in one begins
  where the project says, and the project here says nothing — so it begins
  in the space's own directory, on whatever branch it is on, beside the
  operator: no checkout, no branch, no task, nothing for UZE to deliver,
  because the commits already land where the operator is.

  Every check reads the machine: the directories under `.worktrees`, what
  Git registers as a worktree and a branch, the agents UZE records in its
  task store, and the process table. Nothing about the screen is asserted.

world:
  project: demo-app
  manifest: |
    worktrees:
      target: main
      completion: handoff
      slots: 4

scenes:
  - scene: an agent started in the project's space runs in the project directory
    when:
      - open: "{uze}"
        say: uze opens on the project
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "+  ✦"
        say: open the new-agent picker from the tab strip
        in: strip
        offset: 3
        expect: new agent
      - click: " new agent "
        say: pick Claude Code
        in: pane
        row_offset: 1
        offset: 3
        expect: agent 1
        expect_timeout: 90
        pause: 1.5
    then:
      - process: { matching: claude, cwd: "{project}", alive: true }
        about: the agent's process runs in the project directory itself
      - dir: "{project}/.worktrees/*"
        count: 0
        about: no checkout was created for it
      - git: { worktrees: 1 }
        about: Git registers only the primary checkout
      - git: { branches: "agent/*", count: 0 }
        about: and no agent branch
      - tasks: { count: 0 }
        about: an agent nobody isolated is not a task
      - agents: { count: 1, live: 1, isolated: 0 }
        about: one live agent is recorded, and it holds no checkout

  - scene: a commit made in the tree is on the operator's branch, with nothing to deliver
    when:
      - shell: |
          set -e
          cd {project}
          printf 'pub fn pong() -> &str { "ping" }\n' > src/beside.rs
          git add src/beside.rs
          git commit -qm "feat: answer from beside the operator"
        say: work committed in the project directory, as the agent would commit it
    then:
      - cmd:
          run: cd {project} && git log --format=%s main | grep -q 'answer from beside the operator'
        about: the commit is on the branch the operator is on
      - git: { branches: "agent/*", count: 0 }
        about: still no agent branch to deliver from
      - tasks: { count: 0 }
        about: and nothing for delivery to pick up

  - scene: closing the agent's tab ends the agent
    when:
      - rclick: agent 1
        say: right-click the agent's row
        in: sidebar
        occurrence: last
        expect: Close tab
      - click: Close tab
        in: sidebar
        say: confirm close
        # Nothing on screen appears when a row goes, so the gate is the
        # agent's row no longer being drawn anywhere.
        expect: '\A(?![\s\S]*agent 1)'
        expect_timeout: 20
        pause: 2.0
    then:
      - agents: { count: 1, live: 0 }
        about: the agent is recorded as ended, and still recorded
      - dir: "{project}/.worktrees/*"
        count: 0
        about: nothing was ever created on disk for it
