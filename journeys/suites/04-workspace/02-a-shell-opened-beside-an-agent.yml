journey: a shell opened beside an agent goes when the agent goes
tags: [gate, tui, workspace]
proves: web/content/docs/workspace/index.mdx
about: |
  Open a second tab while an agent is in front of you and it lands in that
  agent's worktree, with its own shell and its own history. It belongs to
  the agent, not to the space: the directory it stands in is the agent's
  checkout, and that checkout is what ends when the agent does.

  This file used to prove the opposite, and the opposite is what was got
  wrong in practice. Leaving the shell behind handed it to the space, which
  then accumulated shells — and, because a slot is only free when nobody is
  standing in it, left a live pane inside a checkout that could never be
  given to the next agent. The space also took the dead agent's directory as
  its own, which is where its caption and the next placement both read
  from.

  So: the agent's shells go with it, the space's own are untouched, the task
  ends, and the slot is free — *because* nothing is left in it. That last
  word is the claim; a slot freed while somebody is still there would be the
  worse bug, and `tests/acceptance/engine.rs` holds that half.

world:
  project: demo-app
  manifest: |
    worktrees:
      default: isolated
      target: main
      completion: handoff
      slots: 4

scenes:
  - scene: an agent, and a shell opened beside it in its own checkout
    when:
      - open: "{uze}"
        expect: demo-app
        expect_timeout: 20
        pause: 1.0
      - click: "✦ new"
        say: open the new-agent picker
        in: sidebar
        expect: new agent
      - click: " new agent "
        say: pick Claude Code
        row_offset: 1
        offset: 3
        # UZE's own drawing, not the stand-in's banner: a gate on a
        # harness's first line of stdout is what timed this scene out on a
        # loaded runner. That the agent's process started is a `then:`.
        expect: agent 1
        expect_timeout: 90
        pause: 1.5
      - click: "+"
        say: open a second tab in the agent's space
        in: strip
        expect: shell 1
        # What is waited on is the server allocating a pty and a shell
        # reaching its prompt — the same work the gesture above budgets 45
        # seconds for. It had 20, which held only because the machine that
        # calibrated it was fast.
        expect_timeout: 45
        pause: 2.0
    then:
      - dir: "{project}/.worktrees/*"
        count: 1
      - tasks: { count: 1, states: [running] }
        about: one agent, one slot, one live task
      - capture: { name: occupied_slot, dirs: "{project}/.worktrees/*" }
      - process: { matching: claude, cwd: "/.worktrees/", alive: true }
        about: the agent's own process is running, in its own checkout
      - process: { matching: bash, cwd: "/.worktrees/", alive: true, count: 1 }
        about: and a shell of the agent's is running inside the same checkout

  - scene: closing the agent takes its shell with it, and the task ends
    when:
      - rclick: agent 1
        say: right-click the agent's row
        in: sidebar
        expect: Close tab
      - click: Close tab
        in: sidebar
        say: confirm close
        # Nothing on screen appears when a row goes, so the gate is no
        # agent item being left on the tree. A lone isolated agent stands at
        # the root indent with no trunk, so its row is known by its status
        # mark and name rather than by a tree glyph.
        expect: '(?m)\A(?![\s\S]*^[▏ ][^\s▾▸] agent \d)'
        expect_timeout: 25
        pause: 3.0
    then:
      - process: { matching: bash, cwd: "/.worktrees/", alive: false }
        about: |
          nothing of the agent's is left standing in the checkout — the
          shell was the agent's context, not the space's, and a pane left
          behind here is what would hold the slot open forever
      - tasks: { count: 1, newest_state: closed }
        about: |
          so the task ends rather than staying live under a pane nobody
          could see the point of
      - dir: "{project}/.worktrees/*"
        same_as: occupied_slot
        about: the slot survives its agent — a checkout is reused, not destroyed
      - git: { worktrees: 2 }
        about: and Git still registers the freed checkout

  - scene: the next agent takes the freed slot rather than a new directory
    when:
      - click: "✦ new"
        say: open the picker again
        in: sidebar
        expect: new agent
      - click: " new agent "
        say: pick Codex
        row_offset: 2
        offset: 3
        # An item on the tree, not the label: the closed agent freed its
        # number, so this one is `agent 1` again — a string the screen was
        # showing a moment ago. The tree it left had no items at all, so the
        # first one back cannot be a stale frame.
        expect: '(?m)^[▏ ][^\s▾▸] agent \d'
        expect_timeout: 90
        pause: 2.0
    then:
      - process: { matching: codex, cwd: "/.worktrees/", alive: true }
        about: the second agent's own process is running, in a checkout
      - dir: "{project}/.worktrees/*"
        same_as: occupied_slot
        about: |
          the same directory, reused — which is only safe because the close
          took everything that was standing in it
      - git: { worktrees: 2 }
        about: and no second checkout was needed
