# Dependency policy, enforced by `cargo deny` (see `make deny`).
#
# Run twice, against two different questions.
#
# The default run resolves the features the *shipped* binary is built with.
# That is the graph a user receives, and it is the one a licence question is
# really about: an optional backend nobody enables is not something this
# project distributes.
#
# `--all-features` then covers the rest, because "not distributed" is not
# the same as "not compiled". `telemetry` is what the documented local
# install (`make install`) builds, and `dev-servers` carries the MCP
# conformance fixture — sixty-odd crates between them, on developers'
# machines and in the Lab image. Nothing about the policy differs between
# the two runs; only the answer to "which crates does it apply to".

[licenses]
# Permissive only. A copyleft crate in the tree is the single most common
# reason a software acquisition stalls, and finding one after it is load
# bearing is far more expensive than refusing it here.
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
]
# The list is a policy, not an inventory: a licence being absent from the
# tree today is not a reason to stop allowing it tomorrow.
unused-allowed-license = "allow"

[bans]
# Two versions of one crate is ordinary in a large graph and is a size
# question, not a legal one.
multiple-versions = "warn"
# A wildcard version cannot be audited: what `cargo deny` read and what the
# next resolution pulls need not be the same crate at all. The workspace's
# own crates are the exception — a `path` dependency resolves to the tree
# being audited, so there is no second crate it could become.
wildcards = "deny"
allow-wildcard-paths = true

[advisories]
yanked = "deny"
# Two crates are flagged `unmaintained`. Neither is a vulnerability, and
# neither can be dropped without changing production Rust, so each is
# recorded here with what would remove it rather than left to fail the gate
# every run until someone stops reading it. A vulnerability advisory is
# never ignored — these entries are for `unmaintained` only, and each one
# names its own exit.
ignore = [
  # bincode 1.3, the terminal runtime's wire format (`uze-terminal`'s
  # length-prefixed frames) and a dev-dependency of the root crate for
  # decoding them in tests. The team ceased development deliberately and
  # considers 1.3.3 complete; there is no advisory of a defect, and no
  # upgrade path within the 1.x line. Removing it means porting the wire
  # format to another codec — a protocol change, not a dependency bump.
  { id = "RUSTSEC-2025-0141", reason = "bincode 1.3 carries the terminal wire format; replacing it is a protocol change" },
  # yaml-rust 0.4.5 reaches the tree only through syntect 5.3, which the
  # diff highlighting in `uze-extensions` uses to load its syntax
  # definitions. Nothing here calls it directly. It leaves when syntect
  # moves to yaml-rust2, which is not a decision this project makes.
  { id = "RUSTSEC-2024-0320", reason = "yaml-rust is transitive through syntect; it leaves when syntect moves to yaml-rust2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
